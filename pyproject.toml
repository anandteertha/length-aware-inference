[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etdl"
version = "0.1.0"
description = "Measured CPU specialization for DistilBERT text classification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.10,<2.11",
  "transformers>=5.1,<5.2",
  "datasets>=4,<5",
  "onnx>=1.20,<2",
  "onnxruntime>=1.23,<2",
  "onnxscript>=0.5,<0.7",
  "numpy>=2.2,<3",
  "psutil>=7,<8",
  "py-cpuinfo>=9,<10",
]

[project.scripts]
etdl = "etdl.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
